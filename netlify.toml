[build]
  command = "npm --prefix netlify/functions install --omit=dev --ignore-scripts && npm run test"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[context.production]
  publish = "."

[context.deploy-preview]
  publish = "."

[context.branch-deploy]
  publish = "."

[dev]
  framework = "#static"
  publish = "."
  port = 8888
  autoLaunch = false

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/"
  to = "/login.html"
  status = 200
  force = true

[[redirects]]
  from = "/index.html"
  to = "/app.html?page=index"
  status = 302
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

